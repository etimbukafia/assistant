[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

# Custom markers
markers =
    unit: Unit tests (fast, isolated, mocked dependencies)
    integration: Integration tests (may use real resources)
    sandbox: Polar sandbox tests (require POLAR_SANDBOX_* env vars)
    slow: Slow tests (LLM inference, API calls)
    api: API endpoint tests
    live: Live tests with real API calls (costs money, variable results)
